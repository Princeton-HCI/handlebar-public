repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart
        language: system
        types: [dart]
        args: ["format", "--output=none", "--set-exit-if-changed"]
        exclude: crepe-flutter-plugin

      - id: flutter-analyze
        name: flutter analyze
        entry: flutter
        language: system
        args: ["analyze", "--no-fatal-infos"]
        stages: [pre-commit]
        exclude: crepe-flutter-plugin